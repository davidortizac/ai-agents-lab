version: "3.9"

services:

  # ── AI Agent ────────────────────────────────────────────────────────────────
  ai-agent:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: ai-agent

    # Load all env vars from .env
    env_file:
      - .env

    # Override Ollama URL for Docker — host.docker.internal resolves to the host machine
    environment:
      OLLAMA_BASE_URL: http://host.docker.internal:11434

    # Interactive terminal — required for the input() loop
    stdin_open: true
    tty: true

    # Mount local directories as volumes so the agent can read/write files
    volumes:
      - ./workspace:/app/workspace   # files the agent can read
      - ./memory:/app/memory         # persistent memory / logs

    # extra_hosts lets the container resolve host.docker.internal on Linux.
    # On Windows/Mac this is automatic; on Linux it maps to the host gateway.
    extra_hosts:
      - "host.docker.internal:host-gateway"

    restart: "no"
